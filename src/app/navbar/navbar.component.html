<nav class="navbar navbar-expand-md sticky-top app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-white" routerLink="/">
      <img src="./images/logo.svg" alt="Bomodoro logo" width="30" height="30" class="me-2">
      Bomodoro
    </a>

    <button
      type="button"
      class="btn theme-toggle ms-auto ms-md-3 me-2 me-md-0 order-md-last"
      data-testid="theme-toggle"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="theme.toggle()">
      @if (isDark()) {
        <!-- Sun -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <!-- Moon -->
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOpen()">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }" 
             (click)="menuOpen.set(false)">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/settings" routerLinkActive="active"
             (click)="menuOpen.set(false)">Settings</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="about"
             (click)="menuOpen.set(false)">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="contact"
             (click)="menuOpen.set(false)">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
