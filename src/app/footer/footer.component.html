<footer class="app-footer mt-5">
  <div class="container py-4">
    <div class="row gy-4 align-items-start">
      <div class="col-md-5">
        <a class="app-footer__brand" routerLink="/">
          <img src="./images/logo.svg" alt="" width="28" height="28" class="me-2" />
          Bomodoro
        </a>
        <p class="app-footer__tagline mb-0">Focus. Break. Repeat.</p>
      </div>

      <nav class="col-6 col-md-3" aria-label="Footer">
        <h2 class="app-footer__heading">Explore</h2>
        <ul class="list-unstyled mb-0">
          <li><a routerLink="/">Timer</a></li>
          <li><a routerLink="/" fragment="about">About</a></li>
          <li><a routerLink="/settings">Settings</a></li>
          <li><a routerLink="/" fragment="contact">Contact</a></li>
        </ul>
      </nav>

      <div class="col-6 col-md-2">
        <h2 class="app-footer__heading">Connect</h2>
        <ul class="list-unstyled mb-0">
          <li><a data-testid="footer-email" [href]="mailto">Email</a></li>
          <li>
            <a data-testid="footer-linkedin" [href]="linkedInUrl" target="_blank" rel="noopener noreferrer">
              LinkedIn<span class="visually-hidden"> (opens in a new tab)</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="col-md-2 text-md-end">
        <button type="button" class="btn app-footer__top" data-testid="back-to-top" (click)="scrollToTop()">
          <span aria-hidden="true">&uarr;</span> Back to top
        </button>
      </div>
    </div>

    <hr class="app-footer__divider" />
    <p class="app-footer__copyright mb-0" data-testid="copyright">&copy; {{ year }} Bo Rosales. All rights reserved.</p>
  </div>
</footer>
